<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5"/>
    <title>Contact Us | Hadron Quantum V2</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="min-h-screen bg-white text-black font-sans antialiased p-8">
    
    <main class="max-w-3xl mx-auto">
        <h1 class="text-4xl font-bold mb-8">Contact Us (V2)</h1>
        
        <!-- Form Retained for Functionality -->
        <div class="bg-gray-100 p-8 rounded-xl">
            <form id="contact-page-form" class="space-y-6" novalidate>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="space-y-1.5">
                        <label for="contact-name" class="block text-sm font-medium text-gray-700">Full Name <span class="text-orange-500">*</span></label>
                        <input type="text" id="contact-name" name="name" required autocomplete="name"
                            class="w-full bg-white border border-gray-300 rounded-xl px-4 py-3 text-black text-sm"
                            placeholder="John Smith">
                    </div>
                    <div class="space-y-1.5">
                        <label for="contact-email" class="block text-sm font-medium text-gray-700">Work Email <span class="text-orange-500">*</span></label>
                        <input type="email" id="contact-email" name="email" required autocomplete="email"
                            class="w-full bg-white border border-gray-300 rounded-xl px-4 py-3 text-black text-sm"
                            placeholder="john@company.com">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="space-y-1.5">
                        <label for="contact-org" class="block text-sm font-medium text-gray-700">Organization</label>
                        <input type="text" id="contact-org" name="organization" autocomplete="organization"
                            class="w-full bg-white border border-gray-300 rounded-xl px-4 py-3 text-black text-sm"
                            placeholder="Enterprise Corp">
                    </div>
                    <div class="space-y-1.5">
                        <label for="contact-service" class="block text-sm font-medium text-gray-700">Interested Service</label>
                        <div class="relative">
                            <select id="contact-service" name="service"
                                class="w-full bg-white border border-gray-300 rounded-xl px-4 py-3 text-black text-sm appearance-none cursor-pointer">
                                <option value="" disabled selected>Select a Service</option>
                                <option value="Capacity & AI Infrastructure Optimizer">Capacity & AI Infrastructure Optimizer</option>
                                <option value="Enterprise CapEx Optimizer">Enterprise CapEx Optimizer</option>
                                <option value="PQC Readiness Audit">PQC Readiness Audit</option>
                                <option value="General Inquiry">General Inquiry</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label for="contact-desc" class="block text-sm font-medium text-gray-700">Message</label>
                    <textarea id="contact-desc" name="description" rows="4"
                        class="w-full bg-white border border-gray-300 rounded-xl px-4 py-3 text-black text-sm resize-none"
                        placeholder="Describe your infrastructure challenges or questions..."></textarea>
                </div>

                <!-- Status Message -->
                <div id="form-status" class="hidden text-sm font-medium p-4 rounded-xl text-center"></div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn"
                    class="w-full bg-black text-white font-semibold py-4 rounded-xl hover:bg-gray-800 transition-all flex justify-center items-center gap-2 text-sm">
                    Send Message
                </button>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('contact-page-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const statusEl = document.getElementById('form-status');
            
            btn.disabled = true;
            btn.innerHTML = 'Sending...';
            
            const formData = {
                name: document.getElementById('contact-name').value,
                email: document.getElementById('contact-email').value,
                organization: document.getElementById('contact-org').value,
                service: document.getElementById('contact-service').value,
                description: document.getElementById('contact-desc').value
            };

            try {
                const response = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const result = await response.json();

                if (!response.ok || !result.success) throw new Error(result.message || 'Send failed');

                statusEl.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'border-red-200');
                statusEl.classList.add('bg-green-100', 'text-green-700', 'border', 'border-green-200');
                statusEl.innerText = '✓ Message sent! We\'ll be in touch within 24 hours.';
                document.getElementById('contact-page-form').reset();
            } catch (error) {
                statusEl.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'border-green-200');
                statusEl.classList.add('bg-red-100', 'text-red-700', 'border', 'border-red-200');
                statusEl.innerText = '✕ Something went wrong. Please email us directly at quantum.lab@hadrongbs.com';
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Send Message';
            }
        });
    </script>
</body>
</html>
