<!DOCTYPE html>
<html lang="en">
<head>
    <meta charSet="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <title>Blogs | Hadron Quantum Labs</title>
    <meta name="description" content="Read the latest insights and research on Quantum Computing and AI infrastructure from Hadron Quantum Labs." />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hq: {
                            dark: '#0a0a0a',
                            panel: '#111111',
                            accent: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-hq-dark text-white font-sans antialiased min-h-screen flex flex-col">
    <!-- Navbar (Simplified version of main navbar for the blog) -->
    <nav class="border-b border-white/10 bg-hq-dark/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/" class="font-bold text-xl tracking-tight">Hadron Quantum</a>
            <div class="space-x-6 text-sm font-medium">
                <a href="/" class="text-gray-400 hover:text-white transition-colors">Home</a>
                <a href="/blogs" class="text-white">Blogs</a>
                <a href="/studio" class="text-hq-accent hover:text-blue-400 transition-colors">HQ Studio</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 w-full">
        <div class="mb-16">
            <h1 class="text-4xl md:text-5xl font-bold tracking-tight mb-4">Latest Insights</h1>
            <p class="text-xl text-gray-400 max-w-2xl">Discover research, whitepapers, and thought leadership from the Hadron Quantum team.</p>
        </div>

        <div id="blog-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Skeleton Loading -->
            <div class="animate-pulse">
                <div class="bg-white/10 h-48 rounded-xl mb-4"></div>
                <div class="h-6 bg-white/10 rounded w-3/4 mb-3"></div>
                <div class="h-4 bg-white/10 rounded w-full mb-2"></div>
                <div class="h-4 bg-white/10 rounded w-2/3"></div>
            </div>
            <div class="animate-pulse">
                <div class="bg-white/10 h-48 rounded-xl mb-4"></div>
                <div class="h-6 bg-white/10 rounded w-3/4 mb-3"></div>
                <div class="h-4 bg-white/10 rounded w-full mb-2"></div>
                <div class="h-4 bg-white/10 rounded w-2/3"></div>
            </div>
            <div class="animate-pulse hidden md:block">
                <div class="bg-white/10 h-48 rounded-xl mb-4"></div>
                <div class="h-6 bg-white/10 rounded w-3/4 mb-3"></div>
                <div class="h-4 bg-white/10 rounded w-full mb-2"></div>
                <div class="h-4 bg-white/10 rounded w-2/3"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-white/10 bg-hq-dark py-12 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-500">
            &copy; 2026 Hadron Global Business Solutions. All rights reserved.
        </div>
    </footer>

    <!-- Fetch Logic -->
    <script>
        // Replace with your actual Supabase URL and Anon Key if you didn't inject them during build
        // For security, the anon key is safe to be public as RLS protects the database.
        const SUPABASE_URL = 'https://clihxetmljczwldiupqv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_MbLstDAvPAB0A7bKJdDubw_niZ807sl';

        async function fetchBlogs() {
            try {
                // Fetch only published documents (status_id = 3) of type BLOG
                const response = await fetch(`${SUPABASE_URL}/rest/v1/documents?status_id=eq.3&type_id=eq.BLOG&order=published_at.desc`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                
                if (!response.ok) throw new Error('Failed to fetch blogs');
                
                const data = await response.json();
                const grid = document.getElementById('blog-grid');
                
                if (data.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center text-gray-500 py-12 border border-white/10 rounded-xl bg-hq-panel">No blogs published yet.</div>';
                    return;
                }

                grid.innerHTML = data.map(doc => `
                    <a href="/article.html?slug=${doc.slug}" class="group block bg-hq-panel rounded-2xl overflow-hidden border border-white/5 hover:border-white/20 transition-all hover:-translate-y-1">
                        <div class="aspect-video bg-black flex items-center justify-center relative overflow-hidden">
                            ${doc.cover_image 
                                ? `<img src="${doc.cover_image}" alt="${doc.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"/>`
                                : `<div class="absolute inset-0 bg-gradient-to-br from-blue-900/20 to-purple-900/20"></div>
                                   <span class="text-white/20 font-bold text-4xl group-hover:scale-110 transition-transform">HQ</span>`
                            }
                        </div>
                        <div class="p-6">
                            <div class="flex items-center gap-2 mb-3">
                                <span class="px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-400 text-xs font-semibold tracking-wide uppercase">${doc.type_id}</span>
                                <span class="text-xs text-gray-500">${new Date(doc.published_at || doc.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                            </div>
                            <h2 class="text-xl font-bold text-white mb-2 group-hover:text-blue-400 transition-colors line-clamp-2">${doc.title}</h2>
                            <p class="text-gray-400 text-sm line-clamp-3">${doc.excerpt || 'Read the full article to learn more...'}</p>
                        </div>
                    </a>
                `).join('');

            } catch (err) {
                console.error(err);
                document.getElementById('blog-grid').innerHTML = '<div class="col-span-full text-center text-red-400">Error loading articles.</div>';
            }
        }

        fetchBlogs();
    </script>
</body>
</html>
